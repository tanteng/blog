<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/custom.css?v=20260818a">
<!-- Mermaid.js: always loaded so fenced ```mermaid code blocks render anywhere -->
<style>
  .mermaid {
    visibility: hidden;
    background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 100%);
    padding: 16px 8px;
    border-radius: 12px;
    margin: 24px 0;
    text-align: center;
    overflow-x: auto;
    min-height: 80px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .mermaid[data-processed="true"],
  .mermaid svg {
    visibility: visible;
  }
  .mermaid svg {
    display: inline-block;
    max-width: 100%;
    height: auto !important;
  }
  /* Triple-backtick mermaid code blocks: hide raw code, keep for mermaid.js */
  pre > code.language-mermaid {
    display: none;
  }
</style>
<script defer src="/js/mermaid.min.js"></script>
<script defer>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof mermaid === 'undefined') return;
    // Convert all fenced ```mermaid code blocks to <div class="mermaid"> for rendering
    document.querySelectorAll('pre > code.language-mermaid').forEach(function(code) {
      var pre = code.parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      pre.parentNode.replaceChild(div, pre);
    });
    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true }
    });
  });
</script>
