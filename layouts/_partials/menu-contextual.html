{{/*
  Override of theme's menu-contextual.html.
  Renders both the table of contents and the related posts list in the aside.
*/}}

{{- if .Params.toc -}}
  <div class="bg-light-gray pa3 nested-list-reset nested-copy-line-height nested-links">
    <p class="f5 b mb3">{{ lang.Translate "whatsInThis" . }}</p>
      {{ .TableOfContents }}
  </div>
{{- end -}}

{{- partials.Include "related-posts.html" . -}}
