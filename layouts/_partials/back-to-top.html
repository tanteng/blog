{{- /*
  回到顶部按钮
  - 滚动超过 ~400px 时淡入显示，点击平滑回到顶部
  - 默认隐藏，class 控制可见性（CSS 用 opacity + visibility 过渡，保留焦点状态）
  - JS 用 rAF 节流，避免滚动事件触发频繁；并兜底 passive listener
  - 不依赖外部库，iOS Safari safe-area-inset 在 CSS 里写
*/ -}}
<button id="back-to-top" type="button" aria-label="回到顶部" title="回到顶部">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('back-to-top');
    if (!btn) return;
    var threshold = 400;
    var ticking = false;
    function update() {
      if (window.scrollY > threshold) {
        btn.classList.add('is-visible');
      } else {
        btn.classList.remove('is-visible');
      }
      ticking = false;
    }
    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    update();
  })();
</script>
