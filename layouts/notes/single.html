{{ define "header" }}
  {{ partials.Include "page-header.html" . }}
{{ end }}

{{ define "main" }}
  <article class="pa3 pa4-ns w-100 w-70-ns center nested-copy-line-height">
    <div class="mb4">
      <a href="/notes/" class="link mid-gray f6">← 返回随笔</a>
    </div>

    <div class="note-content lh-copy f5 f4-ns mid-gray nested-links">
      {{ .Content }}
    </div>

    {{ with .Params.images }}
      {{ $count := len . }}
      <div class="note-images mt3 {{ if eq $count 1 }}single{{ else }}grid{{ end }}">
        {{ range . }}
          <img src="{{ . | relURL }}" alt="" loading="lazy" class="br2 db" />
        {{ end }}
      </div>
    {{ end }}

    <time class="f7 mt3 db mid-gray" {{ fmt.Printf `datetime="%s"` (.Date.Format "2006-01-02T15:04:05Z07:00") | safe.HTMLAttr }}>
      {{- .Date.Format "2006-01-02 15:04" -}}
    </time>
  </article>
{{ end }}
