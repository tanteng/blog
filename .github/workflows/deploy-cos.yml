# Build Hugo site → Upload to Tencent COS → Purge EdgeOne cache
name: Deploy to COS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: deploy-cos
  cancel-in-progress: true

env:
  HUGO_VERSION: '0.160.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Hugo
        run: |
          HUGO_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "Downloading Hugo ${HUGO_VERSION} from ${HUGO_URL}"
          # 先下载再解压，带 3 次重试，避免网络抖动导致管道失败
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/hugo.tar.gz "$HUGO_URL"
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          rm -f /tmp/hugo.tar.gz
          hugo version

      - name: Build
        # --cleanDestinationDir 清空 public/ 中上一次 build 留下的 orphan 输出
        # （如 front matter 的 url 字段变更后，旧路径 HTML 不会被自动删除）
        run: hugo --minify --cleanDestinationDir

      - name: Build search index
        run: npx pagefind --site public --force-language zh

      - name: Install coscli
        run: |
          curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -o /usr/local/bin/coscli
          chmod +x /usr/local/bin/coscli

      # 静态资源（CSS/JS）先传，再传整站。
      # 原因：HTML 里引用的资源名带内容指纹，而 public/ 里年份目录（2014/…2024/）排在
      # css/ 前面，若按默认顺序同步，会出现「HTML 已上线、它引用的 CSS 还没传完」的窗口，
      # 该窗口内 CDN 回源只会拿到 404。先传资源再传 HTML，任何时刻访问都是完整的。
      - name: Upload static assets first
        # 这一步只是缩小「HTML 已上线、资源还没传完」的窗口，属优化项而非正确性前提：
        # 资源名本身带内容指纹，串版本已经不可能发生。所以失败不阻断部署。
        continue-on-error: true
        run: |
          for d in css js ananke; do
            if [ -d "./public/$d" ]; then
              echo "→ 先传 ./public/$d/"
              coscli sync "./public/$d/" "cos://${{ secrets.TENCENT_BUCKET }}/$d/" \
                -r \
                -e cos.${{ secrets.TENCENT_REGION }}.myqcloud.com \
                -i ${{ secrets.TENCENT_SECRET_ID }} \
                -k ${{ secrets.TENCENT_SECRET_KEY }} \
                --force
            fi
          done

      - name: Upload to COS
        run: |
          coscli sync ./public/ cos://${{ secrets.TENCENT_BUCKET }}/ \
            -r \
            -e cos.${{ secrets.TENCENT_REGION }}.myqcloud.com \
            -i ${{ secrets.TENCENT_SECRET_ID }} \
            -k ${{ secrets.TENCENT_SECRET_KEY }} \
            --delete \
            --force

      - name: Install tccli
        run: pip install tccli

      - name: Detect changes
        id: detect-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # 变更基线取「本次推送前的 SHA」（github.event.before），不要用 HEAD~1。
          # 原因：HEAD~1 只看最后一个提交，一次 push 提交多个 commit 时，前面那些提交
          # 对 layouts/ static/ 的改动会被完全漏掉 → 该全站清缓存却只清了文章 URL，
          # 于是 CDN 继续发旧 CSS（2026-09-28 两栏对照在 PC 上不生效就是这个原因）。
          # 取不到基线（workflow_dispatch / 浅克隆里没有该提交 / 新分支）时看不到影响面，
          # 保守按「全站清理」处理，宁可多清不可漏清。
          DIFF_BASE=""
          if [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] \
             && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            DIFF_BASE="$EVENT_BEFORE"
          fi

          FORCE_PURGE_ALL=false
          if [ -n "$DIFF_BASE" ]; then
            echo "变更基线: $DIFF_BASE"
            CHANGED_FILES=$(git diff --name-only "$DIFF_BASE" HEAD)
          else
            echo "⚠️ 无法确定变更基线（event=$EVENT_NAME before=$EVENT_BEFORE），按全站清理处理"
            FORCE_PURGE_ALL=true
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi

          echo "变更文件列表:"
          echo "$CHANGED_FILES"

          # 1. 全局文件检测：模板/样式/配置等变更影响所有页面，需全站清理
          GLOBAL_CHANGES=$(echo "$CHANGED_FILES" | grep -E "^(layouts/|static/|config\.|themes/|assets/|i18n/|\.github/)" || true)
          if [ -n "$GLOBAL_CHANGES" ] || [ "$FORCE_PURGE_ALL" = "true" ]; then
            echo "🔄 检测到全局文件变更（模板/样式/配置），需清理全站缓存"
            echo "$GLOBAL_CHANGES"
            echo "purge_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "purge_all=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. URL 列表生成函数：根据文件列表输出 JSON 数组
          # 参数1: 匹配的文件列表; 参数2: URL 前缀（含域名和路径段，如 https://blog.tanteng.space/posts/）
          # 规则：basename 为 _index.md 时，slug 取父目录名；否则取 basename 去扩展名
          build_url_list() {
            local files="$1"
            local base_url="$2"
            [ -z "$files" ] && { echo "[]"; return; }
            local json="["
            local first=true
            for file in $files; do
              local base=$(basename "$file")
              local slug
              if [ "$base" = "_index.md" ]; then
                slug=$(basename "$(dirname "$file")")
              else
                slug="${base%.md}"
              fi
              local url="${base_url}${slug}/"
              if [ "$first" = true ]; then
                json="${json}\"${url}\""
                first=false
              else
                json="${json},\"${url}\""
              fi
            done
            json="${json}]"
            echo "$json"
          }

          BASE="https://blog.tanteng.space"

          # 3. 文章（content/posts/*.md）
          # ⚠️ 不能一律拼 /posts/<slug>/：站上约 124 篇文章在 frontmatter 里写了
          # url: /YYYY/MM/<slug>/，它们的真实路径不是 /posts/<slug>/。按老写法等于去清
          # 一个不存在的地址，真正的文章页缓存根本没被清掉（改了标题/正文却在 CDN 上看到旧版）。
          # 规则：frontmatter 有 url: 就用它，没有才回落到 /posts/<slug>/。
          POSTS=$(echo "$CHANGED_FILES" | grep "^content/posts/[^/]*\.md$" || true)
          if [ -n "$POSTS" ]; then
            echo "检测到修改的文章:"; echo "$POSTS"
            ARTICLE_URLS="["
            ARTICLE_FIRST=true
            for f in $POSTS; do
              # 只在 frontmatter 段（首个 --- 到第二个 ---）里找 url:
              FM_URL=$(sed -n '2,/^---[[:space:]]*$/p' "$f" | sed -n 's/^url:[[:space:]]*//p' | head -1 | tr -d '"'"'"' \r')
              if [ -n "$FM_URL" ]; then
                case "$FM_URL" in
                  /*) ARTICLE_URL="${BASE}${FM_URL}" ;;
                  *)  ARTICLE_URL="${BASE}/${FM_URL}" ;;
                esac
                # 去掉可能存在的重复斜杠（BASE 已无尾斜杠）
                ARTICLE_URL=$(echo "$ARTICLE_URL" | sed 's#://#@@#;s#//#/#g;s#@@#://#')
              else
                ARTICLE_URL="${BASE}/posts/$(basename "$f" .md)/"
              fi
              echo "  $f → $ARTICLE_URL"
              if [ "$ARTICLE_FIRST" = true ]; then
                ARTICLE_URLS="${ARTICLE_URLS}\"${ARTICLE_URL}\""
                ARTICLE_FIRST=false
              else
                ARTICLE_URLS="${ARTICLE_URLS},\"${ARTICLE_URL}\""
              fi
            done
            ARTICLE_URLS="${ARTICLE_URLS}]"
            echo "article_urls=${ARTICLE_URLS}" >> "$GITHUB_OUTPUT"
            echo "has_articles=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_articles=false" >> "$GITHUB_OUTPUT"
          fi

          # 4. 笔记（content/notes/*.md）→ /notes/<slug>/（修复 #15: notes 路径缓存未被 purge）
          NOTES=$(echo "$CHANGED_FILES" | grep "^content/notes/[^/]*\.md$" || true)
          if [ -n "$NOTES" ]; then
            echo "检测到修改的笔记:"; echo "$NOTES"
            NOTE_URLS=$(build_url_list "$NOTES" "$BASE/notes/")
            echo "note_urls=${NOTE_URLS}" >> "$GITHUB_OUTPUT"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

          # 5. 分类页（content/categories/<slug>/_index.md）→ /categories/<slug>/
          CATEGORIES=$(echo "$CHANGED_FILES" | grep "^content/categories/[^/]*/_index\.md$" || true)
          if [ -n "$CATEGORIES" ]; then
            echo "检测到修改的分类页:"; echo "$CATEGORIES"
            CATEGORY_URLS=$(build_url_list "$CATEGORIES" "$BASE/categories/")
            echo "category_urls=${CATEGORY_URLS}" >> "$GITHUB_OUTPUT"
            echo "has_categories=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_categories=false" >> "$GITHUB_OUTPUT"
          fi

          # 6. 标签页（content/tags/<slug>/_index.md）→ /tags/<slug>/
          TAGS=$(echo "$CHANGED_FILES" | grep "^content/tags/[^/]*/_index\.md$" || true)
          if [ -n "$TAGS" ]; then
            echo "检测到修改的标签页:"; echo "$TAGS"
            TAG_URLS=$(build_url_list "$TAGS" "$BASE/tags/")
            echo "tag_urls=${TAG_URLS}" >> "$GITHUB_OUTPUT"
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          fi

          # 7. 顶层页面（content/_index.md, about.md, search.md）→ 各自固定 URL
          TOP_URLS_JSON="["
          TOP_FIRST=true
          for f in $CHANGED_FILES; do
            case "$f" in
              content/_index.md)
                url="$BASE/";;
              content/about.md)
                url="$BASE/about/";;
              content/search.md)
                url="$BASE/search/";;
              *)
                continue;;
            esac
            if [ "$TOP_FIRST" = true ]; then
              TOP_URLS_JSON="${TOP_URLS_JSON}\"${url}\""
              TOP_FIRST=false
            else
              TOP_URLS_JSON="${TOP_URLS_JSON},\"${url}\""
            fi
          done
          TOP_URLS_JSON="${TOP_URLS_JSON}]"
          if [ "$TOP_FIRST" = false ]; then
            echo "检测到修改的顶层页面:"
            echo "$TOP_URLS_JSON"
            echo "top_urls=${TOP_URLS_JSON}" >> "$GITHUB_OUTPUT"
            echo "has_top_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_top_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge EdgeOne Cache
        # ⚠️ 所有 ${{ }} 值必须经 env 传入，禁止直接插值进 run 脚本。
        # 原因：表达式结果是含双引号的 JSON（如 ["https://.../"]），写成
        #   append_urls "笔记" "${{ steps...note_urls }}"
        # 插值后形如 ... "["https://..."]" ，双引号会被 shell 当语法吃掉，
        # 拼出的 --Targets 变成非法 JSON，tccli 直接 exit 255（曾导致连续 3 次部署失败）。
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
          PURGE_ALL: ${{ steps.detect-changes.outputs.purge_all }}
          ARTICLE_URLS: ${{ steps.detect-changes.outputs.article_urls }}
          NOTE_URLS: ${{ steps.detect-changes.outputs.note_urls }}
          CATEGORY_URLS: ${{ steps.detect-changes.outputs.category_urls }}
          TAG_URLS: ${{ steps.detect-changes.outputs.tag_urls }}
          TOP_URLS: ${{ steps.detect-changes.outputs.top_urls }}
        run: |
          ZONE_ID="$EDGEONE_ZONE_ID"

          if [ "$PURGE_ALL" = "true" ]; then
            # 全局文件变更（layouts/static/config 等），清理全站缓存
            echo "🧹 全局变更，使用前缀清理全站缓存"
            tccli teo CreatePurgeTask \
              --region ap-guangzhou \
              --ZoneId "$ZONE_ID" \
              --Type purge_prefix \
              --Targets '["https://blog.tanteng.space/"]'
            echo "✅ EdgeOne 全站缓存已清理"
            exit 0
          fi

          BASE="https://blog.tanteng.space"
          # 公共列表页：任何内容变更都需要刷新（首页/文章列表/分类列表/标签列表/笔记列表）
          ALL_URLS="[\"${BASE}/\",\"${BASE}/posts/\",\"${BASE}/categories/\",\"${BASE}/tags/\",\"${BASE}/notes/\"]"

          # 拼装完整 URL 列表：通用 + 各类特定 URL
          append_urls() {
            local label="$1"
            local value="$2"
            [ -z "$value" ] && return
            [ "$value" = "[]" ] && return
            local inner=$(echo "$value" | sed 's/^\[//;s/\]$//')
            ALL_URLS="[$(echo "$ALL_URLS" | sed 's/^\[//;s/\]$//'),${inner}]"
            echo "  + ${label}: ${value}"
          }

          echo "🧹 准备清理 EdgeOne 缓存..."
          append_urls "文章"   "$ARTICLE_URLS"
          append_urls "笔记"   "$NOTE_URLS"
          append_urls "分类页" "$CATEGORY_URLS"
          append_urls "标签页" "$TAG_URLS"
          append_urls "顶层页" "$TOP_URLS"

          echo "📋 最终清理列表: ${ALL_URLS}"

          # 防回归：拼装错误会产出非法 JSON，提前拦住并给出可读报错
          echo "$ALL_URLS" | python3 -c '
          import json, sys
          urls = json.load(sys.stdin)
          print(f"✅ Targets JSON 合法，共 {len(urls)} 个 URL")
          '

          tccli teo CreatePurgeTask \
            --region ap-guangzhou \
            --ZoneId "$ZONE_ID" \
            --Type purge_url \
            --Targets "$ALL_URLS"
          echo "✅ EdgeOne 缓存已清理"
