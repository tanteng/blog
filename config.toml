baseURL = "https://blog.tanteng.space"
defaultContentLanguage = 'zh'
title = "Tony老师的博客"
theme = "ananke"
resourceDir = "../resources"

[languages.zh]
languageName = "中文"
weight = 1

[related]
  threshold = 80
  toLower = false
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "https://blog.tanteng.space"
    weight = -1

  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    identifier = "photos"
    name = "相册"
    url = "https://photos.tanteng.space"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 10

[pagination]
# 列表页每页篇数（首页在 layouts/home.html 中单独指定，不受此值影响）
pagerSize = 30

[params]
customCSS = ["css/custom.css"]
mainSections = ["posts"]
recent_posts_number = 20
featured_image = "https://tanteng.space/blog-cover.jpg"
description = "记录生活与成长的空间。热爱摄影、旅行、技术，这里有技术笔记与生活随想。"
copyright = "谈腾"
open_graph_title = "Tony老师的博客"
open_graph_description = "Hi，我是Tony老师"
open_graph_image = "https://tanteng.space/blog-cover.jpg"

[minify]
  [minify.tdewolff]
    [minify.tdewolff.js]
      keepWhitespace = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    # 浅色配色，跟站点的浅色主题统一。Hugo 不配这项时默认是 monokai（深色）。
    style = "github"
    # 用内联样式输出高亮，不依赖单独生成的 chroma 样式表
    noClasses = true
    # 未标注语言的代码块保持原样，不要猜语言（ASCII 图会被猜错）
    guessSyntax = false
    # 不开行号
    lineNos = false
    # 制表符按 4 列展开，避免 <pre> 里 tab 被撑成 8 列
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[markup.mermaid]
  generateSWM = true

