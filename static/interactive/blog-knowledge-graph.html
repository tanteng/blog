<style>
  :root {

    --text: #e8eaed; --text-dim: #9aa0a6; --accent: #7fb3d5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #container { display: flex; height: 100vh; }
  #sidebar {
    width: 280px; padding: 18px 20px;
    background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0;
  }
  #sidebar h2 { margin: 0 0 4px; font-size: 16px; color: var(--accent); font-weight: 600; }
  #sidebar .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; }
  .stat {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .stat span:last-child { color: var(--accent); font-weight: 600; }
  .section { margin-top: 20px; }
  .section h3 { font-size: 13px; color: var(--text-dim); margin: 0 0 8px; font-weight: 500; }
  .top-item {
    padding: 6px 8px; margin: 2px 0; border-radius: 4px;
    background: rgba(255,255,255,0.03); font-size: 12px;
    display: flex; justify-content: space-between; cursor: pointer;
    transition: background 0.15s;
  }
  .top-item:hover { background: rgba(127,179,213,0.15); }
  .top-item .deg { color: var(--accent); margin-left: 8px; }
  #network { flex: 1; background: var(--bg); position: relative; }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--text-dim); font-size: 14px;
  }
  #search {
    width: 100%; padding: 8px 12px; margin-bottom: 12px;
    background: #0f1115; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px;
    font-family: inherit;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .legend { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 12px; color: var(--text-dim); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  #footer-note {
    position: absolute; bottom: 8px; right: 12px;
    color: var(--text-dim); font-size: 11px; opacity: 0.6;
  }
</style>
</head>

      <div class="legend"><span class="legend-dot" style="background:#f4d35e"></span>选中节点</div>
    </div>
    <div class="section">
      <h3>操作</h3>
